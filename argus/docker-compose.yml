version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: argus-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus_secret}
      POSTGRES_DB: ${POSTGRES_DB:-argus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./argus/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - argus-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: argus-backend
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      LLM_MAX_CALLS: ${LLM_MAX_CALLS:-12}
      LLM_MAX_RPM: ${LLM_MAX_RPM:-5}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:-argus_secret}@db:5432/${POSTGRES_DB:-argus}
      JWT_SECRET: ${JWT_SECRET:-replace_with_64_char_random_string}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUDIT_OUTPUT_DIR: /app/audit_outputs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./regulations:/app/regulations
      - ./policies:/app/policies
      - ./audit_outputs:/app/audit_outputs
      - ./.llm_cache:/app/.llm_cache
      - ./logs:/app/logs
    networks:
      - argus-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: argus-dashboard
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - argus-network

  prometheus:
    image: prom/prometheus:latest
    container_name: argus-prometheus
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - argus-network

volumes:
  postgres_data:
  prometheus_data:

networks:
  argus-network:
    driver: bridge
